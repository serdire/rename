<style>
  @font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;
    src:url("assets/fonts/jetbrains-mono-normal.woff2") format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-style:italic;font-weight:100 800;font-display:swap;
    src:url("assets/fonts/jetbrains-mono-italic.woff2") format("woff2")}
  :root{--bg:#0e0d0b;--panel:#161410;--fg:#d8d3c5;--dim:#8b8270;--grn:#83c167;--red:#e0705f;
    --amber:#d8a657;--line:#211f19;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.7}
  ::selection{background:var(--grn);color:var(--bg)}
  a{color:var(--amber);text-decoration:none;border-bottom:1px solid transparent}
  .chrome{display:flex;gap:10px;align-items:center;background:#100e0b;border-bottom:1px solid var(--line);
    padding:9px 16px;font-size:12px;position:sticky;top:0}
  .dots{display:flex;gap:7px}.dots i{width:11px;height:11px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:var(--red)}.dots i:nth-child(2){background:var(--amber)}.dots i:nth-child(3){background:var(--grn)}
  .dotlink{display:inline-flex;cursor:pointer}
  .dotlink:hover{opacity:.75}
  .chrome .file{color:var(--dim)}
  .tabs{display:flex;gap:4px;min-width:0;overflow-x:auto}
  .tab{color:var(--dim);border:1px solid transparent;border-radius:3px;padding:2px 9px;
    white-space:nowrap;transition:color .12s,background .12s}
  a.tab:hover{color:var(--amber);background:var(--panel)}
  .tab.new{color:var(--amber)}
  .tab.new::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:7px;vertical-align:middle;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .tab.on{color:var(--fg);background:var(--panel);border-color:var(--line)}
  @media(max-width:560px){.chrome .file{display:none}}
  .wrap{max-width:820px;margin:0 auto;padding:54px 24px 90px}
  .label{color:var(--dim);font-size:.82rem;margin:0 0 1.1em;letter-spacing:.02em}
  .label::before{content:"## ";color:var(--grn)}
  h1{font-weight:700;font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.25;letter-spacing:-.01em;
    margin:0 0 .9em;max-width:24ch}
  .built{display:flex;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);
    border-radius:4px;background:var(--panel);color:var(--fg);font-size:.9rem;line-height:1.65;
    transition:border-color .12s}
  .built+.built{margin-top:12px}
  .built:hover{border-color:var(--amber)}
  .built img{flex:none;width:40px;height:auto}
  .built b{color:var(--amber);font-weight:700}
  .footnote{color:var(--dim);font-size:.86rem;margin-top:26px;line-height:1.7}
</style>
</head>

</div>

<div class="wrap">
